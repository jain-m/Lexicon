<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Word & Quote Dashboard</title>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-main: #2c3e50;
            --text-muted: #7f8c8d;
            --accent-dict: #3498db;
            --accent-quote: #e67e22;
            --accent-trash: #e74c3c;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            position: relative;
        }

        /* Top Right Settings Button Position */
        .settings-btn-container {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 10;
        }

        .btn-settings {
            background-color: var(--card-bg);
            color: var(--text-muted);
            border: none;
            width: 48px;  
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            transition: all 0.2s ease;
        }

        .btn-settings:hover {
            transform: scale(1.05);
            color: var(--text-main);
            box-shadow: 0 6px 20px rgba(0,0,0,0.1);
        }

        .container {
            width: 100%;
            max-width: 600px;
            perspective: 1000px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 20px;
            padding: 40px;
            box-shadow: var(--shadow);
            transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.4s ease;
            opacity: 0;
            transform: translateY(20px) scale(0.95);
            min-height: 250px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .card.visible {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 6px;
        }

        .card.dictionary::before {
            background-color: var(--accent-dict);
        }

        .card.quote::before {
            background-color: var(--accent-quote);
        }

        .dict-container, .quote-container {
            display: none;
        }

        .word {
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: var(--text-main);
            margin-bottom: 12px;
        }

        .tag {
            display: inline-block;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            padding: 4px 10px;
            border-radius: 50px;
            margin-bottom: 20px;
            letter-spacing: 0.5px;
        }

        .dictionary .tag {
            background-color: rgba(52, 152, 219, 0.1);
            color: var(--accent-dict);
        }

        .quote .tag {
            background-color: rgba(230, 126, 34, 0.1);
            color: var(--accent-quote);
        }

        .definition-wrapper {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            width: 100%;
        }

        .definition {
            font-size: 1.25rem;
            line-height: 1.6;
            color: var(--text-muted);
            font-weight: 400;
            flex: 1;
        }

        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .inline-calendar-btn, .inline-speak-btn, .inline-trash-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 8px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s ease, color 0.2s ease;
            border-radius: 50%;
        }

        .inline-calendar-btn:active, .inline-speak-btn:active, .inline-trash-btn:active {
            transform: scale(0.9);
        }

        .inline-calendar-btn:hover, .inline-speak-btn:hover {
            color: var(--text-main);
        }

        .inline-trash-btn:hover {
            color: var(--accent-trash);
        }

        .quote-container {
            position: relative;
        }

        .quote-text-layout {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            width: 100%;
            position: relative;
            z-index: 1;
        }

        .quote-text {
            font-size: 1.6rem;
            font-style: italic;
            line-height: 1.5;
            color: var(--text-main);
            font-weight: 600;
            flex: 1;
        }

        .quote-mark {
            position: absolute;
            top: -40px;
            left: -20px;
            font-size: 8rem;
            color: rgba(230, 126, 34, 0.08);
            font-family: Georgia, serif;
            user-select: none;
            line-height: 1;
            z-index: 0;
        }

        .controls {
            margin-top: 30px;
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .btn {
            background-color: var(--text-main);
            color: white;
            border: none;
            width: 56px;  
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: all 0.2s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.15);
        }

        /* Modal Panel styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 100;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .modal.open {
            display: flex;
            opacity: 1;
        }

        .modal-content {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 20px;
            width: 90%;
            max-width: 500px;
            max-height: 80vh;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
        }

        .modal-title {
            font-size: 1.5rem;
            font-weight: 700;
        }

        .close-modal {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--text-muted);
        }

        .trash-list {
            overflow-y: auto;
            flex: 1;
            margin-bottom: 20px;
            list-style: none;
            padding-right: 5px;
        }

        .trash-item {
            padding: 12px;
            border-bottom: 1px solid #f4f6f9;
            font-size: 0.95rem;
            line-height: 1.4;
        }

        .trash-item:last-child {
            border-bottom: none;
        }

        .empty-trash-msg {
            color: var(--text-muted);
            text-align: center;
            padding: 30px 0;
            font-style: italic;
        }

        .modal-footer {
            display: flex;
            justify-content: flex-end;
        }

        .calendar-result {
            color: var(--text-muted);
            font-size: 1.25rem;
            line-height: 1.5;
            text-align: center;
            padding: 20px 0 30px;
        }

        .danger-btn {
            background-color: var(--accent-trash);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: background-color 0.2s ease;
        }

        .danger-btn:hover {
            background-color: #c0392b;
        }

        .danger-btn:disabled {
            background-color: #bdc3c7;
            cursor: not-allowed;
        }

    </style>
</head>
<body>

    <!-- Repositioned Settings Trigger Panel -->
    <div class="settings-btn-container">
        <button class="btn-settings" onclick="openTrashModal()" aria-label="View Trash and Settings">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">

            </svg>
        </button>
    </div>

    <div class="container">
        <div id="display-card" class="card">
            
            <!-- Vocabulary Layout View -->
            <div id="dict-view" class="dict-container">
                <span class="tag">Vocabulary</span>
                <h1 id="vocab-word" class="word"></h1>
                <div class="definition-wrapper">
                    <p id="vocab-definition" class="definition"></p>
                    <div class="action-buttons">
                        <button type="button" class="inline-calendar-btn" onclick="window.openCalendarModal(event)" aria-label="Days until March 15, 2069">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                                <line x1="16" y1="2" x2="16" y2="6"></line>
                                <line x1="8" y1="2" x2="8" y2="6"></line>
                                <line x1="3" y1="10" x2="21" y2="10"></line>
                            </svg>
                        </button>
                        <button class="inline-speak-btn" onclick="speakCurrentEntry(event)" aria-label="Speak Entry">
                            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                                <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                            </svg>
                        </button>
                        <button class="inline-trash-btn" onclick="trashCurrentEntry(event)" aria-label="Trash Entry">
                            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="3 6 5 6 21 6"></polyline>
                                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                                <line x1="10" y1="11" x2="10" y2="17"></line>
                                <line x1="14" y1="11" x2="14" y2="17"></line>
                            </svg>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Quote Layout View -->
            <div id="quote-view" class="quote-container">
                <span class="tag">Thought</span>
                <span class="quote-mark">“</span>
                <div class="quote-text-layout">
                    <p id="quote-string" class="quote-text"></p>
                    <div class="action-buttons">
                        <button type="button" class="inline-calendar-btn" onclick="window.openCalendarModal(event)" aria-label="Days until March 15, 2069">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                                <line x1="16" y1="2" x2="16" y2="6"></line>
                                <line x1="8" y1="2" x2="8" y2="6"></line>
                                <line x1="3" y1="10" x2="21" y2="10"></line>
                            </svg>
                        </button>
                        <button class="inline-speak-btn" onclick="speakCurrentEntry(event)" aria-label="Speak Quote">
                            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                                <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                            </svg>
                        </button>
                        <button class="inline-trash-btn" onclick="trashCurrentEntry(event)" aria-label="Trash Quote">
                            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="3 6 5 6 21 6"></polyline>
                                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                                <line x1="10" y1="11" x2="10" y2="17"></line>
                                <line x1="14" y1="11" x2="14" y2="17"></line>
                            </svg>
                        </button>
                    </div>
                </div>
            </div>

        </div>

        <div class="controls">
            <div class="btn id-next-btn" role="button" aria-label="Next Entry">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="9 18 15 12 9 6"></polyline>
                </svg>
            </div>
        </div>
    </div>

    <!-- Trash Modal -->
    <div id="trash-modal" class="modal" onclick="closeTrashModalOutside(event)">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">Trashcan</h2>
                <button class="close-modal" onclick="closeTrashModal()">&times;</button>
            </div>
            <ul id="trash-list" class="trash-list">
                <!-- Trashed items append here dynamically -->
            </ul>
            <div class="modal-footer">
                <button id="empty-trash-btn" class="danger-btn" onclick="emptyTrash()">Empty Trashcan</button>
            </div>
        </div>
    </div>

    <!-- Calendar Modal -->
    <div id="calendar-modal" class="modal" onclick="closeCalendarModalOutside(event)">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">Days to Mar 15, 2069</h2>
                <button type="button" class="close-modal" onclick="closeCalendarModal()" aria-label="Close Calendar">&times;</button>
            </div>
            <p id="calendar-result" class="calendar-result"></p>
        </div>
    </div>

        let currentRawEntry = "";

        window.openCalendarModal = function openCalendarModal(e) {
            if (e) {
                e.preventDefault();
                e.stopPropagation();
            }
            const today = new Date();
            const targetDate = new Date(2069, 2, 15); // March 15, 2069
            const timeDiff = targetDate - today;
            const daysDiff = Math.ceil(timeDiff / (1000 * 60 * 60 * 24));

            const result = document.getElementById('calendar-result');
            const modal = document.getElementById('calendar-modal');
            if (daysDiff >= 0) {
                result.textContent = `${daysDiff}`;
            } else {
                result.textContent = `${Math.abs(daysDiff)} days have passed since March 15, 2069.`;
            }
            modal.classList.add('open');
        };

        function closeCalendarModal() {
            document.getElementById('calendar-modal').classList.remove('open');
        }

        function closeCalendarModalOutside(e) {
            if (e.target.id === 'calendar-modal') {
                closeCalendarModal();
            }
        }

        function displayRandomEntry() {
            const card = document.getElementById('display-card');
            const dictView = document.getElementById('dict-view');
            const quoteView = document.getElementById('quote-view');
            
            if (!card || !dictView || !quoteView) return;

            if (window.speechSynthesis) {
                window.speechSynthesis.cancel();
            }
            
            card.classList.remove('visible');
            
            setTimeout(() => {
                const randomIndex = Math.floor(Math.random() * entries.length);
                currentRawEntry = entries[randomIndex].trim();

                card.classList.remove('dictionary', 'quote');
                dictView.style.display = 'none';
                quoteView.style.display = 'none';

                if (currentRawEntry.includes(':')) {
                    const colonIndex = currentRawEntry.indexOf(':');
                    const term = currentRawEntry.substring(0, colonIndex).trim();
                    const definition = currentRawEntry.substring(colonIndex + 1).trim();

                    card.classList.add('dictionary');
                    document.getElementById('vocab-word').textContent = term;
                    document.getElementById('vocab-definition').textContent = definition;
                    dictView.style.display = 'block';
                } else {
                    card.classList.add('quote');
                    document.getElementById('quote-string').textContent = currentRawEntry;
                    quoteView.style.display = 'block';
                }

                card.classList.add('visible');
            }, 250);
        }

        function speakCurrentEntry(e) {
            if (e) {
                e.preventDefault();
                e.stopPropagation();
            }

            if (!window.speechSynthesis) return;
            window.speechSynthesis.cancel();

            const card = document.getElementById('display-card');
            let textToSpeak = "";

            if (card.classList.contains('dictionary')) {
                const word = document.getElementById('vocab-word').textContent;
                const definition = document.getElementById('vocab-definition').textContent;
                textToSpeak = `${word}. ${definition}`;
            } else if (card.classList.contains('quote')) {
                textToSpeak = document.getElementById('quote-string').textContent;
            }

            if (textToSpeak) {
                const utterance = new SpeechSynthesisUtterance(textToSpeak);
                utterance.rate = 0.95;
                window.speechSynthesis.speak(utterance);
            }
        }

        function trashCurrentEntry(e) {
            if (e) {
                e.preventDefault();
                e.stopPropagation();
            }

            if (!currentRawEntry) return;

            let trashedItems = [];
            try {
                trashedItems = JSON.parse(localStorage.getItem('lexicon_trash')) || [];
            } catch (err) {
                trashedItems = [];
            }

            if (!trashedItems.includes(currentRawEntry)) {
                trashedItems.push(currentRawEntry);
                localStorage.setItem('lexicon_trash', JSON.stringify(trashedItems));
                alert('Entry added to the trashcan.');
            } else {
                alert('This entry is already in your trashcan.');
            }
        }

        function openTrashModal() {
            const modal = document.getElementById('trash-modal');
            const trashList = document.getElementById('trash-list');
            const emptyBtn = document.getElementById('empty-trash-btn');
            
            trashList.innerHTML = '';
            
            let trashedItems = [];
            try {
                trashedItems = JSON.parse(localStorage.getItem('lexicon_trash')) || [];
            } catch (err) {
                trashedItems = [];
            }

            if (trashedItems.length === 0) {
                const emptyLi = document.createElement('li');
                emptyLi.className = 'empty-trash-msg';
                emptyLi.textContent = 'The trashcan is empty.';
                trashList.appendChild(emptyLi);
                emptyBtn.disabled = true;
            } else {
                trashedItems.forEach(item => {
                    const li = document.createElement('li');
                    li.className = 'trash-item';
                    li.textContent = item;
                    trashList.appendChild(li);
                });
                emptyBtn.disabled = false;
            }

            modal.classList.add('open');
        }

        function closeTrashModal() {
            document.getElementById('trash-modal').classList.remove('open');
        }

        function closeTrashModalOutside(e) {
            if (e.target.id === 'trash-modal') {
                closeTrashModal();
            }
        }

        function emptyTrash() {
            localStorage.removeItem('lexicon_trash');
            openTrashModal(); 
        }

        window.addEventListener('DOMContentLoaded', function() {
            displayRandomEntry();

            const nextBtn = document.querySelector('.id-next-btn');
            if (nextBtn) {
                nextBtn.onclick = function(e) {
                    e.preventDefault();
                    e.stopPropagation();
                    displayRandomEntry();
                };
            }
