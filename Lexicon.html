<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Random Word & Quote Dashboard</title>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-main: #2c3e50;
            --text-muted: #7f8c8d;
            --accent-dict: #3498db;
            --accent-quote: #e67e22;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            perspective: 1000px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 20px;
            padding: 40px;
            box-shadow: var(--shadow);
            transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.4s ease;
            opacity: 0;
            transform: translateY(20px) scale(0.95);
            min-height: 250px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .card.visible {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 6px;
        }

        .card.dictionary::before {
            background-color: var(--accent-dict);
        }

        .card.quote::before {
            background-color: var(--accent-quote);
        }

        .dict-container, .quote-container {
            display: none;
        }

        .word {
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: var(--text-main);
            margin-bottom: 12px;
        }

        .tag {
            display: inline-block;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            padding: 4px 10px;
            border-radius: 50px;
            margin-bottom: 20px;
            letter-spacing: 0.5px;
        }

        .dictionary .tag {
            background-color: rgba(52, 152, 219, 0.1);
            color: var(--accent-dict);
        }

        .quote .tag {
            background-color: rgba(230, 126, 34, 0.1);
            color: var(--accent-quote);
        }

        .definition-wrapper {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            width: 100%;
        }

        .definition {
            font-size: 1.25rem;
            line-height: 1.6;
            color: var(--text-muted);
            font-weight: 400;
            flex: 1;
        }

        .inline-speak-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 8px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s ease, color 0.2s ease;
            border-radius: 50%;
        }

        .inline-speak-btn:active {
            transform: scale(0.9);
        }

        .inline-speak-btn:hover {
            color: var(--text-main);
        }

        .quote-container {
            position: relative;
        }

        .quote-text-layout {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            width: 100%;
            position: relative;
            z-index: 1;
        }

        .quote-text {
            font-size: 1.6rem;
            font-style: italic;
            line-height: 1.5;
            color: var(--text-main);
            font-weight: 600;
            flex: 1;
        }

        .quote-mark {
            position: absolute;
            top: -40px;
            left: -20px;
            font-size: 8rem;
            color: rgba(230, 126, 34, 0.08);
            font-family: Georgia, serif;
            user-select: none;
            line-height: 1;
            z-index: 0;
        }

        .controls {
            margin-top: 30px;
            display: flex;
            justify-content: center;
        }

        .btn {
            background-color: var(--text-main);
            color: white;
            border: none;
            width: 56px;  
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: all 0.2s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.15);
        }

    </style>
</head>

        function displayRandomEntry() {
            const card = document.getElementById('display-card');
            const dictView = document.getElementById('dict-view');
            const quoteView = document.getElementById('quote-view');
            
            if (!card || !dictView || !quoteView) return;

            if (window.speechSynthesis) {
                window.speechSynthesis.cancel();
            }
            
            card.classList.remove('visible');
            
            setTimeout(() => {
                const randomIndex = Math.floor(Math.random() * entries.length);
                const entryStr = entries[randomIndex].trim();

                card.classList.remove('dictionary', 'quote');
                dictView.style.display = 'none';
                quoteView.style.display = 'none';

                if (entryStr.includes(':')) {
                    const colonIndex = entryStr.indexOf(':');
                    const term = entryStr.substring(0, colonIndex).trim();
                    const definition = entryStr.substring(colonIndex + 1).trim();

                    card.classList.add('dictionary');
                    document.getElementById('vocab-word').textContent = term;
                    document.getElementById('vocab-definition').textContent = definition;
                    dictView.style.display = 'block';
                } else {
                    card.classList.add('quote');
                    document.getElementById('quote-string').textContent = entryStr;
                    quoteView.style.display = 'block';
                }

                card.classList.add('visible');
            }, 250);
        }

        function speakCurrentEntry(e) {
            if (e) {
                e.preventDefault();
                e.stopPropagation();
            }

            if (!window.speechSynthesis) return;
            window.speechSynthesis.cancel();

            const card = document.getElementById('display-card');
            let textToSpeak = "";

            if (card.classList.contains('dictionary')) {
                const word = document.getElementById('vocab-word').textContent;
                const definition = document.getElementById('vocab-definition').textContent;
                textToSpeak = `${word}. ${definition}`;
            } else if (card.classList.contains('quote')) {
                textToSpeak = document.getElementById('quote-string').textContent;
            }

            if (textToSpeak) {
                const utterance = new SpeechSynthesisUtterance(textToSpeak);
                utterance.rate = 0.95;
                window.speechSynthesis.speak(utterance);
            }
        }

        // Standard direct window trigger safely bypassing strict context constraints
        window.onload = function() {
            displayRandomEntry();

            const nextBtn = document.querySelector('.id-next-btn');
            if (nextBtn) {
                nextBtn.onclick = function(e) {
                    e.preventDefault();
                    e.stopPropagation();
                    displayRandomEntry();
                };
            }
        };
